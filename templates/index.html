<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emotion Recognition</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: #fff;
            padding: 2.5rem 2rem;
            border-radius: 28px;
            box-shadow: 0 8px 32px rgba(44, 62, 80, 0.18);
            text-align: center;
            max-width: 800px;
            width: 100%;
            animation: fadeIn 1s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px);}
            to { opacity: 1; transform: translateY(0);}
        }
        h1 {
            color: #2d3a4b;
            margin-bottom: 2rem;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 1px;
        }
        form {
            margin-bottom: 2rem;
            width: 100%;
        }
        .form-row {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .custom-file-input {
            display: none;
        }
        .file-label {
            display: inline-block;
            background: #e3f6fc;
            color: #2d3a4b;
            padding: 0.7rem 1.2rem;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: background 0.2s, border 0.2s, color 0.2s;
            border: 2px dashed #74ebd5;
        }
        .file-label:hover, .file-label:focus {
            background: #b6eaff;
            border: 2px solid #57c6e1;
            color: #1b2838;
        }
        .file-name {
            display: block;
            color: #888;
            font-size: 0.98rem;
            min-width: 120px;
            min-height: 1.2em;
            text-align: left;
        }
        .action-btn {
            background: #74ebd5;
            color: #2d3a4b;
            border: none;
            padding: 0.8rem 1.6rem;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(44, 62, 80, 0.08);
            transition: background 0.2s, transform 0.2s;
            margin: 0 0.2rem;
        }
        .action-btn:hover {
            background: #57c6e1;
            transform: scale(1.04);
        }
        #openCameraBtn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        #cameraContainer {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 1rem;
        }
        #video {
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(44,62,80,0.08);
        }
        #canvas {
            display: none;
            margin-top: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(44,62,80,0.08);
        }
        .result-section {
            display:
 flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 2.5rem;
            margin-top: 2rem;
        }
        .result-card {
            padding: 1.2rem 1rem;
            background: #e3f6fc;
            border-radius: 14px;
            color: #1b2838;
            font-size: 1.35rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            box-shadow: 0 2px 8px rgba(44, 62, 80, 0.08);
        }
        .result-card i {
            font-size: 2.2rem;
            color: #74ebd5;
        }
        .processed-img-block {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .processed-img-block img {
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(44,62,80,0.08);
            width: 64px;
            height: 64px;
        }
        .processed-img-block .desc {
            font-size: 0.9rem;
            color: #888;
            margin-top: 0.5rem;
        }
        @media (max-width: 900px) {
            .container {
                max-width: 98vw;
            }
            .result-section {
                flex-direction: column;
                gap: 1.5rem;
            }
        }
        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
                gap: 10px;
            }
            .container {
                padding: 1.2rem 0.5rem;
            }
            h1 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Emotion Recognition</h1>
        <form method="post" enctype="multipart/form-data" id="uploadForm">
            <div class="form-row">
                <label class="file-label" for="fileInput">
                    <i class="fa-solid fa-image"></i> Choose Image
                </label>
                <input type="file" name="image" accept="image/*" class="custom-file-input" id="fileInput" onchange="updateFileName()">
                <span class="file-name" id="fileName">No file selected</span>
                <button type="button" class="action-btn" id="openCameraBtn">
                    <i class="fa-solid fa-camera"></i> Use Camera
                </button>
                <button type="submit" class="action-btn">Upload & Analyze</button>
            </div>
            <div id="cameraContainer">
                <video id="video" width="220" height="165" autoplay></video>
                <button type="button" class="action-btn" id="snapBtn" style="margin-top:10px;">Take Photo</button>
                <canvas id="canvas" width="220" height="165"></canvas>
            </div>
            <input type="hidden" name="camera_image" id="cameraImageInput">
        </form>
        {% if error %}
            <div style="color: red; margin-bottom: 1rem;">{{ error }}</div>
        {% endif %}
        {% if emotion %}
        <div class="result-section">
            <div class="processed-img-block">
                <img src="data:image/png;base64,{{ img_base64 }}" alt="Uploaded image">
                <div class="desc">Processed image</div>
            </div>
            <div class="result-card">
                <i class="fa-solid fa-face-{{ 'smile' if emotion == 'happy' else 'frown' if emotion == 'sad' else 'meh' }}"></i>
                Predicted emotion: <span style="font-weight:700;">{{ emotion|capitalize }}</span>
            </div>
        </div>
        {% endif %}
    </div>
    <script>
        function updateFileName() {
            const input = document.getElementById('fileInput');
            const fileName = document.getElementById('fileName');
            fileName.textContent = input.files.length > 0 ? input.files[0].name : 'No file selected';
        }

        // Camera logic
        const openCameraBtn = document.getElementById('openCameraBtn');
        const cameraContainer = document.getElementById('cameraContainer');
        const video = document.getElementById('video');
        const snapBtn = document.getElementById('snapBtn');
        const canvas = document.getElementById('canvas');
        const cameraImageInput = document.getElementById('cameraImageInput');
        const fileInput = document.getElementById('fileInput');
        let stream = null;

        openCameraBtn.onclick = async function(e) {
            e.preventDefault();
            cameraContainer.style.display = 'flex';
            canvas.style.display = 'none';
            if (!stream) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = stream;
                } catch (err) {
                    alert('Cannot access camera: ' + err);
                }
            }
        };

        snapBtn.onclick = function(e) {
            e.preventDefault();
            canvas.style.display = 'block';
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            // Stop the camera after photo
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            // Convert canvas to dataURL and set to hidden input
            const dataURL = canvas.toDataURL('image/png');
            cameraImageInput.value = dataURL;
            // Hide file input to avoid confusion
            fileInput.value = '';
            document.getElementById('fileName').textContent = 'Photo from camera';
            cameraContainer.style.display = 'none';
        };
    </script>
</body>
</html>
